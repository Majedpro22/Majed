<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Regennacht</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: full-bleed canvas scene, one quiet control strip pinned to the bottom edge */
  :root {
    color-scheme: dark;
    --night: #0a1420;
    --ink: #dfe8f1;
    --muted: #8a9bb0;
    --panel: rgba(12, 22, 34, 0.72);
    --line: rgba(160, 190, 220, 0.18);
    --sodium: #f2a65a;
    --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  html, body { height: 100%; }
  body {
    background: var(--night);
    color: var(--ink);
    font-family: var(--font-display);
    overflow: hidden;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .title {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 20px);
    left: 20px;
    right: 20px;
    pointer-events: none;
    display: grid;
    gap: 4px;
  }
  .title h1 {
    margin: 0;
    font-size: clamp(1.6rem, 4vw, 2.6rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    text-wrap: balance;
  }
  .title p {
    margin: 0;
    font-family: var(--font-mono);
    font-size: 0.8rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .title p b { color: var(--sodium); font-weight: 500; }

  .controls {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 14px 16px calc(env(safe-area-inset-bottom, 0px) + 14px);
    background: var(--panel);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-top: 1px solid var(--line);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 14px 28px;
    font-size: 0.85rem;
  }
  .field { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .field label { color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; font-size: 0.72rem; }
  input[type="range"] { width: 150px; max-width: 40vw; accent-color: var(--sodium); }
  input[type="checkbox"] { accent-color: var(--sodium); width: 16px; height: 16px; margin: 0; }
  button {
    font: inherit;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 14px;
    cursor: pointer;
  }
  button:hover { border-color: var(--sodium); }
  button[aria-pressed="true"] { border-color: var(--sodium); color: var(--sodium); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--sodium); outline-offset: 3px; }
</style>
<style>body { margin: 0; }</style>
</head>
<body>

<canvas id="scene" aria-label="Animierter Regen über einer nächtlichen Stadt"></canvas>

<div class="title">
  <h1>Regennacht</h1>
  <p id="readout">≈ 4.6 mm/h · <b>mäßiger Regen</b></p>
</div>

<div class="controls">
  <div class="field">
    <label for="intensity">Regen</label>
    <input id="intensity" type="range" min="0" max="100" value="45">
  </div>
  <div class="field">
    <label for="wind">Wind</label>
    <input id="wind" type="range" min="-100" max="100" value="20">
  </div>
  <div class="field">
    <input id="lightning" type="checkbox" checked>
    <label for="lightning">Blitze</label>
  </div>
  <button id="sound" type="button" aria-pressed="false">Ton an</button>
  <button id="pause" type="button" aria-pressed="false">Pause</button>
</div>

<script>
(() => {
  const canvas = document.getElementById("scene");
  const ctx = canvas.getContext("2d");
  const $ = (id) => document.getElementById(id);
  const ui = {
    intensity: $("intensity"), wind: $("wind"), lightning: $("lightning"),
    sound: $("sound"), pause: $("pause"), readout: $("readout"),
  };

  let W = 0, H = 0, DPR = 1, horizon = 0;
  let bg = null;               // offscreen sky + skyline + ground
  let lights = [];             // warm city lights that reflect on the wet street
  const drops = [], ripples = [], splashes = [];
  let flash = 0, bolt = null, boltLife = 0;
  let last = performance.now(), time = 0;
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let paused = reduceMotion;

  const intensity = () => ui.intensity.value / 100;
  const wind = () => ui.wind.value / 100;
  const rand = (a, b) => a + Math.random() * (b - a);

  // Rain rate in mm/h, classified with the usual thresholds (light < 2.5, moderate 2.5–10, heavy > 10)
  function updateReadout() {
    const rate = 0.3 * Math.pow(150, intensity());
    const label = rate < 2.5 ? "leichter Regen" : rate < 10 ? "mäßiger Regen" : "starker Regen";
    ui.readout.innerHTML = `≈ ${rate < 10 ? rate.toFixed(1) : Math.round(rate)} mm/h · <b>${label}</b>`;
  }

  function buildBackground() {
    bg = document.createElement("canvas");
    bg.width = W * DPR; bg.height = H * DPR;
    const b = bg.getContext("2d");
    b.scale(DPR, DPR);

    const sky = b.createLinearGradient(0, 0, 0, horizon);
    sky.addColorStop(0, "#060d17");
    sky.addColorStop(1, "#1b2a3d");
    b.fillStyle = sky;
    b.fillRect(0, 0, W, horizon);

    // Skyline: two rows of buildings, the back row lighter for depth
    lights = [];
    for (const row of [{ c: "#121e2c", hMax: 0.34, win: 0.05 }, { c: "#0b141f", hMax: 0.24, win: 0.09 }]) {
      let x = -10;
      while (x < W + 10) {
        const bw = rand(30, 90);
        const bh = rand(0.06, row.hMax) * H;
        b.fillStyle = row.c;
        b.fillRect(x, horizon - bh, bw, bh);
        for (let wy = horizon - bh + 8; wy < horizon - 8; wy += 11) {
          for (let wx = x + 6; wx < x + bw - 6; wx += 9) {
            if (Math.random() < row.win) {
              b.fillStyle = Math.random() < 0.8 ? "rgba(242,166,90,0.55)" : "rgba(170,205,235,0.45)";
              b.fillRect(wx, wy, 3, 5);
            }
          }
        }
        x += bw + rand(0, 6);
      }
    }

    // Street lamps on the horizon
    const n = Math.max(3, Math.round(W / 260));
    for (let i = 0; i < n; i++) {
      lights.push({ x: (i + 0.5) / n * W + rand(-40, 40), y: horizon - rand(6, 30), r: rand(18, 34) });
    }

    const ground = b.createLinearGradient(0, horizon, 0, H);
    ground.addColorStop(0, "#142233");
    ground.addColorStop(1, "#05090f");
    b.fillStyle = ground;
    b.fillRect(0, horizon, W, H - horizon);
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    horizon = H * 0.68;
    buildBackground();
    for (const d of drops) resetDrop(d, true);
  }

  // z: 0 = far (near the horizon), 1 = close to the viewer
  function resetDrop(d, anywhere) {
    d.z = Math.pow(Math.random(), 1.6);
    d.speed = 520 + 1100 * d.z;
    d.len = 7 + 24 * d.z;
    d.width = 0.5 + 1.3 * d.z;
    d.alpha = 0.12 + 0.45 * d.z;
    d.landY = horizon + (H - horizon) * d.z;
    d.x = rand(-0.35 * W, 1.35 * W);
    d.y = anywhere ? rand(-50, d.landY) : rand(-120, -10);
    return d;
  }

  function targetCount() {
    const area = (W * H) / (1280 * 800);
    return Math.round((60 + 1500 * Math.pow(intensity(), 1.3)) * Math.max(0.4, area));
  }

  function land(d) {
    const s = 0.4 + d.z;
    ripples.push({ x: d.x, y: d.landY, r: 1, max: rand(6, 16) * s, a: 0.5 * d.z + 0.1 });
    if (d.z > 0.35) {
      const k = 2 + Math.floor(Math.random() * 3);
      for (let i = 0; i < k; i++) {
        splashes.push({
          x: d.x, y: d.landY,
          vx: rand(-60, 60) * s + wind() * 40, vy: rand(-170, -70) * s,
          life: 1, size: 0.6 + d.z,
        });
      }
    }
  }

  function makeBolt() {
    const pts = [];
    let x = rand(0.15, 0.85) * W, y = 0;
    const end = horizon - rand(20, 120);
    while (y < end) {
      pts.push([x, y]);
      x += rand(-28, 28);
      y += rand(14, 36);
    }
    pts.push([x, end]);
    return pts;
  }

  function step(dt) {
    time += dt;
    const target = targetCount();
    while (drops.length < target) drops.push(resetDrop({}, false));
    if (drops.length > target) drops.length = target;

    const wx = wind() * 0.55;
    for (const d of drops) {
      d.y += d.speed * dt;
      d.x += d.speed * wx * dt;
      if (d.y >= d.landY) { land(d); resetDrop(d, false); }
    }

    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i];
      r.r += 22 * dt * (r.max / 10);
      r.a -= 0.9 * dt;
      if (r.a <= 0 || r.r > r.max) ripples.splice(i, 1);
    }
    for (let i = splashes.length - 1; i >= 0; i--) {
      const s = splashes[i];
      s.vy += 900 * dt;
      s.x += s.vx * dt; s.y += s.vy * dt;
      s.life -= 2.6 * dt;
      if (s.life <= 0) splashes.splice(i, 1);
    }

    const chance = ui.lightning.checked ? (0.015 + 0.22 * Math.pow(intensity(), 2)) * dt : 0;
    if (Math.random() < chance) {
      flash = rand(0.35, 0.7);
      bolt = makeBolt();
      boltLife = 0.18;
    }
    flash = Math.max(0, flash - 1.8 * dt);
    boltLife = Math.max(0, boltLife - dt);
  }

  function draw() {
    ctx.drawImage(bg, 0, 0, W, H);

    // Lamp glow and its shimmering reflection on the wet street
    for (let i = 0; i < lights.length; i++) {
      const l = lights[i];
      const g = ctx.createRadialGradient(l.x, l.y, 0, l.x, l.y, l.r * 2.2);
      g.addColorStop(0, "rgba(255,196,128,0.9)");
      g.addColorStop(0.25, "rgba(242,166,90,0.35)");
      g.addColorStop(1, "rgba(242,166,90,0)");
      ctx.fillStyle = g;
      ctx.fillRect(l.x - l.r * 2.2, l.y - l.r * 2.2, l.r * 4.4, l.r * 4.4);

      const shimmer = 0.75 + 0.25 * Math.sin(time * 3 + i * 1.7);
      const rw = l.r * 0.9;
      const rg = ctx.createLinearGradient(0, horizon, 0, H);
      rg.addColorStop(0, `rgba(242,166,90,${0.32 * shimmer})`);
      rg.addColorStop(1, "rgba(242,166,90,0)");
      ctx.fillStyle = rg;
      for (let y = horizon; y < H; y += 3) {
        const off = Math.sin(y * 0.09 + time * 4 + i) * (2 + (y - horizon) * 0.03);
        const spread = rw * (1 + (y - horizon) / (H - horizon) * 1.5);
        ctx.fillRect(l.x - spread / 2 + off, y, spread, 3);
      }
    }

    // Ripples
    ctx.lineWidth = 1;
    for (const r of ripples) {
      ctx.strokeStyle = `rgba(190,215,240,${Math.max(0, r.a)})`;
      ctx.beginPath();
      ctx.ellipse(r.x, r.y, r.r, r.r * 0.28, 0, 0, Math.PI * 2);
      ctx.stroke();
    }

    // Rain streaks, slanted by the wind
    const wx = wind() * 0.55;
    ctx.lineCap = "round";
    for (const d of drops) {
      ctx.strokeStyle = `rgba(185,210,235,${d.alpha})`;
      ctx.lineWidth = d.width;
      ctx.beginPath();
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x - d.len * wx, d.y - d.len);
      ctx.stroke();
    }

    ctx.fillStyle = "rgba(200,222,245,0.7)";
    for (const s of splashes) {
      ctx.globalAlpha = Math.max(0, s.life);
      ctx.fillRect(s.x, s.y, s.size, s.size);
    }
    ctx.globalAlpha = 1;

    if (boltLife > 0 && bolt) {
      ctx.strokeStyle = `rgba(235,240,255,${boltLife / 0.18})`;
      ctx.lineWidth = 2;
      ctx.shadowColor = "rgba(180,200,255,0.9)";
      ctx.shadowBlur = 18;
      ctx.beginPath();
      bolt.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
    if (flash > 0) {
      ctx.fillStyle = `rgba(200,215,255,${flash * 0.45})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!paused) { step(dt); draw(); }
    requestAnimationFrame(loop);
  }

  // Rain sound: looped noise through a band filter, louder with more rain
  let audio = null;
  function startSound() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    const ac = new AC();
    const buf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const data = buf.getChannelData(0);
    let lastOut = 0;
    for (let i = 0; i < data.length; i++) {
      const white = Math.random() * 2 - 1;
      lastOut = (lastOut + 0.06 * white) / 1.06;
      data[i] = lastOut * 3 + white * 0.25;
    }
    const src = ac.createBufferSource();
    src.buffer = buf; src.loop = true;
    const hp = ac.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 250;
    const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 3200;
    const gain = ac.createGain();
    src.connect(hp).connect(lp).connect(gain).connect(ac.destination);
    src.start();
    audio = { ac, gain };
    setVolume();
    return true;
  }
  function setVolume() {
    if (audio) audio.gain.gain.setTargetAtTime(0.04 + 0.35 * intensity(), audio.ac.currentTime, 0.2);
  }

  ui.sound.addEventListener("click", () => {
    const on = ui.sound.getAttribute("aria-pressed") !== "true";
    if (on && !audio && !startSound()) return;
    if (audio) on ? audio.ac.resume() : audio.ac.suspend();
    ui.sound.setAttribute("aria-pressed", String(on));
    ui.sound.textContent = on ? "Ton aus" : "Ton an";
  });

  function setPaused(p) {
    paused = p;
    ui.pause.setAttribute("aria-pressed", String(p));
    ui.pause.textContent = p ? "Abspielen" : "Pause";
  }
  ui.pause.addEventListener("click", () => setPaused(!paused));

  ui.intensity.addEventListener("input", () => { updateReadout(); setVolume(); });
  window.addEventListener("resize", () => { resize(); if (paused) draw(); });

  resize();
  updateReadout();
  // Fill the scene before the first frame so the still image already shows rain
  for (let i = 0; i < targetCount(); i++) drops.push(resetDrop({}, true));
  draw();
  setPaused(paused);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
